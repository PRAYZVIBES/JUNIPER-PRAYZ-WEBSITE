<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">JUNIPER &amp; PRAYZ Good Noise logo</title>
  <desc id="desc">A bright rosette made from sound waves and two crossing lines above the JUNIPER &amp; PRAYZ wordmark.</desc>
  <style>
    .ink{fill:#15180f}.cream{fill:#f4ebd8}.gold{fill:#e7c96f}.moss{fill:#6d7949}.line{fill:none;stroke:#15180f;stroke-width:48;stroke-linecap:round;stroke-linejoin:round}
    .brand{font:800 150px 'Instrument Sans',Arial,sans-serif;letter-spacing:-5px}.label{font:700 42px 'Instrument Sans',Arial,sans-serif;letter-spacing:12px}
  </style>
  <rect class="gold" width="1600" height="1600" rx="110"/>
  <g transform="translate(800 610)">
    <circle class="cream" r="330"/>
    <g class="ink">
      <ellipse rx="92" ry="348"/>
      <ellipse rx="92" ry="348" transform="rotate(45)"/>
      <ellipse rx="92" ry="348" transform="rotate(90)"/>
      <ellipse rx="92" ry="348" transform="rotate(135)"/>
    </g>
    <circle class="moss" r="205"/>
    <path class="line" d="M-120-120 120 120M120-120-120 120"/>
    <circle class="gold" r="58"/>
  </g>
  <text x="800" y="1235" text-anchor="middle" class="ink brand">JUNIPER &amp; PRAYZ</text>
  <text x="800" y="1335" text-anchor="middle" class="ink label">GOOD NOISE / MADE OUTSIDE</text>
</svg>
